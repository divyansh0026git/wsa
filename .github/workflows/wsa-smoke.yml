name: WSA platform smoke checks
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: python -m wsa_agent --version
      - run: python -m pytest tests/test_cross_platform_setup.py -q
      - if: runner.os == 'Windows'
        run: python -m pytest tests/test_process_outcomes.py -q
