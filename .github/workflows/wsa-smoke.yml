name: WSA platform smoke checks
on: [push, pull_request]
jobs:
  smoke:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e . pytest
      - run: python -m wsa_agent --version
      - run: python -m pytest tests/test_cross_platform_setup.py -q
      - run: python -m pytest tests/test_server_api.py::EndToEndDataFlowTests tests/test_background_tab_relay.py tests/test_tui_refresh.py -q
      - if: runner.os == 'macOS'
        run: python -m pytest tests/test_terminal_e2e.py -q
      - if: runner.os == 'Windows'
        run: python -m pytest tests/test_process_outcomes.py -q
      - if: runner.os == 'macOS'
        run: |
          sh scripts/install.sh
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/.venv/bin/wsa" --version
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install.ps1
          Set-Location $env:RUNNER_TEMP
          & "$env:GITHUB_WORKSPACE\.venv\Scripts\wsa.exe" --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
