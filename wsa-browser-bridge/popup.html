<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WSA — Web Browser Bridge</title>
  <style>
    :root {
      --bg: #141517;
      --surface: #1b1d20;
      --surface-step: #23262b;
      --border: rgba(236, 238, 242, 0.08);
      --border-strong: rgba(236, 238, 242, 0.14);
      --text: #eceef2;
      --text-secondary: #b7bdc7;
      --text-muted: #848b96;
      --accent: #d77757;
      --accent-hover: #e18465;
      --accent-active: #c86a4b;
      --ok: #5bb974;
      --warn: #e0a84b;
      --err: #e06c6c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 376px;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--text);
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-muted);
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 11px;
      font-weight: 500;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-muted);
      flex-shrink: 0;
    }
    .dot.ok { background: var(--ok); }
    .dot.warn { background: var(--warn); }
    .dot.err { background: var(--err); }

    .meta-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 12px;
      margin-bottom: 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 12px;
    }

    .meta-pair {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .meta-label {
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .meta-val {
      color: var(--text);
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .meta-val.muted {
      color: var(--text-muted);
      font-weight: 400;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px 6px;
      font-size: 11.5px;
      color: var(--text-muted);
    }

    .site-count {
      font-variant-numeric: tabular-nums;
      color: var(--text-secondary);
    }

    .sites-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 12px;
    }

    .site-row {
      display: grid;
      grid-template-columns: 14px minmax(0, 92px) minmax(0, 1fr);
      align-items: center;
      gap: 8px;
      min-height: 44px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid transparent;
      transition: background-color 120ms ease, border-color 120ms ease;
    }

    .site-row + .site-row {
      margin-top: 2px;
    }

    .site-row.is-active {
      background: var(--surface-step);
      border-color: var(--border-strong);
    }

    .site-dot-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .site-info {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 1px;
    }

    .site-name {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-row.is-closed .site-name {
      color: var(--text-muted);
      font-weight: 400;
    }

    .site-host {
      font-size: 10.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .site-right {
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 1px;
      text-align: right;
    }

    .site-model {
      max-width: 100%;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-variant-numeric: tabular-nums;
    }

    .site-row.is-open .site-model {
      color: var(--text);
    }

    .site-row.is-closed .site-model {
      color: var(--text-muted);
      font-weight: 400;
    }

    .site-email {
      max-width: 100%;
      font-size: 10.5px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sync-btn {
      width: 100%;
      height: 36px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #111214;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 120ms ease, opacity 120ms ease;
    }

    .sync-btn:hover:not(:disabled) {
      background: var(--accent-hover);
    }

    .sync-btn:active:not(:disabled) {
      background: var(--accent-active);
    }

    .sync-btn:focus-visible {
      outline: 2px solid var(--text);
      outline-offset: 2px;
    }

    .sync-btn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .output {
      margin-top: 8px;
      min-height: 16px;
      font-size: 11.5px;
      color: var(--text-muted);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .output.ok { color: var(--ok); }
    .output.err { color: var(--err); }

    .footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      letter-spacing: 0.01em;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="brand">
      <span class="brand-title">WSA</span>
      <span class="brand-sub">Web bridge</span>
    </div>
    <div class="status-pill" id="statusPill">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Checking</span>
    </div>
  </header>

  <section class="meta-bar" aria-label="Browser runtime">
    <div class="meta-pair">
      <span class="meta-label">Browser</span>
      <span class="meta-val muted" id="metaBrowser">Detecting</span>
    </div>
    <div class="meta-pair">
      <span class="meta-label">Active</span>
      <span class="meta-val muted" id="metaSite">None</span>
    </div>
  </section>

  <div class="section-head">
    <span>Connected sites</span>
    <span class="site-count" id="siteCount">0/5 open</span>
  </div>

  <section class="sites-card" id="sitesList" aria-label="Connected web agent tabs">
    <div class="site-row is-closed" data-provider="claude">
      <div class="site-dot-wrap"><span class="dot" id="dot-claude"></span></div>
      <div class="site-info">
        <span class="site-name">Claude</span>
        <span class="site-host">claude.ai</span>
      </div>
      <div class="site-right">
        <span class="site-model" id="model-claude">Not open</span>
        <span class="site-email" id="email-claude"></span>
      </div>
    </div>

    <div class="site-row is-closed" data-provider="deepseek">
      <div class="site-dot-wrap"><span class="dot" id="dot-deepseek"></span></div>
      <div class="site-info">
        <span class="site-name">DeepSeek</span>
        <span class="site-host">chat.deepseek.com</span>
      </div>
      <div class="site-right">
        <span class="site-model" id="model-deepseek">Not open</span>
        <span class="site-email" id="email-deepseek"></span>
      </div>
    </div>

    <div class="site-row is-closed" data-provider="gemini">
      <div class="site-dot-wrap"><span class="dot" id="dot-gemini"></span></div>
      <div class="site-info">
        <span class="site-name">Gemini</span>
        <span class="site-host">gemini.google.com</span>
      </div>
      <div class="site-right">
        <span class="site-model" id="model-gemini">Not open</span>
        <span class="site-email" id="email-gemini"></span>
      </div>
    </div>

    <div class="site-row is-closed" data-provider="chatgpt">
      <div class="site-dot-wrap"><span class="dot" id="dot-chatgpt"></span></div>
      <div class="site-info">
        <span class="site-name">ChatGPT</span>
        <span class="site-host">chatgpt.com</span>
      </div>
      <div class="site-right">
        <span class="site-model" id="model-chatgpt">Not open</span>
        <span class="site-email" id="email-chatgpt"></span>
      </div>
    </div>

    <div class="site-row is-closed" data-provider="venice">
      <div class="site-dot-wrap"><span class="dot" id="dot-venice"></span></div>
      <div class="site-info">
        <span class="site-name">Venice</span>
        <span class="site-host">venice.ai</span>
      </div>
      <div class="site-right">
        <span class="site-model" id="model-venice">Not open</span>
        <span class="site-email" id="email-venice"></span>
      </div>
    </div>
  </section>

  <button type="button" class="sync-btn" id="syncBtn">Sync</button>
  <div class="output" id="output" aria-live="polite"></div>
  <footer class="footer">Engineered by Divyansh Saraf</footer>

  <script src="popup.js"></script>
</body>
</html>
