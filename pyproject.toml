[project]
name = "wsa"
version = "1.2.0"
description = "WSA — local coding agent and browser bridge"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.25",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "websocket-client>=1.6",
]

[project.optional-dependencies]
streaming = ["httpx>=0.25"]

[project.scripts]
wsa        = "wsa_agent.__main__:main"
wsa-server = "wsa_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wsa_server*", "wsa_agent*"]
