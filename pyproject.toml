[project]
name = "wsa"
version = "1.2.0"
description = "Local terminal coding agent and browser bridge for web AI models (Claude, Gemini, ChatGPT, DeepSeek, Venice)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = [
    "ai-agent",
    "coding-agent",
    "browser-bridge",
    "gpt-6",
    "gpt-6-astra",
    "gpt-6-1-astra",
    "claude-sonnet-5-5",
    "claude-opus-5-5",
    "claude-fable-5-2",
    "claude-mythos-5-2",
    "gemini-4-carbon",
    "gemini-4-argon",
    "gemini-4-hydrogen",
    "deepseek-v4-pro",
    "deepseek-v4-1-flash",
    "deepseek-r1",
    "terminal-assistant",
]
dependencies = [
    "httpx>=0.25",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "websocket-client>=1.6",
    "Pillow>=9.1",
    "pytest>=7.4",
]

[project.optional-dependencies]
streaming = ["httpx>=0.25"]

[project.scripts]
wsa        = "wsa_agent.__main__:main"
wsa-server = "wsa_server.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["wsa_server*", "wsa_agent*"]

[tool.setuptools.package-data]
wsa_agent = ["skills/*/SKILL.md", "skills/*/LICENSE.txt"]
